[project]
name = "etf-momentum-strategy"
version = "0.1.0"
description = "ETF sector momentum ranking and backtesting toolkit"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
etf-momentum = "etf_momentum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etf_momentum"]
